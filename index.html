<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d0f13">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Productivity">
<meta name="application-name" content="Productivity">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Web-App: Die Statusleiste des iPhones liegt ueber der Seite
   (black-translucent). Ein fester Streifen in Grundfarbe verdeckt darunter
   durchscrollenden Inhalt; der Inhalt beginnt unter der Leiste. */
/* hidden muss wirklich verbergen: .sperre{display:flex} schlug sonst das
   hidden-Attribut, und der Sperrbildschirm lag nach dem Entsperren weiter
   ueber der fertigen Seite (27.09.). Auf claude.ai brachte die Huelle
   diese Regel mit, hier fehlte sie. */
[hidden]{display:none!important}
html{min-height:100%}
body{padding-top:env(safe-area-inset-top,0px)}
.statusleiste{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#0d0f13;z-index:30}

.sperre{position:fixed;inset:0;z-index:40;background:#0d0f13;display:flex;align-items:center;justify-content:center;
        padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.sperre .kasten{width:100%;max-width:360px;text-align:center}
.sperre img{width:190px;height:auto;margin:0 auto 22px;display:block}
.sperre h1{font:600 26px/1.15 "Saira",-apple-system,system-ui,sans-serif;margin:0 0 8px;color:#eceff4}
.sperre p{margin:0 0 22px;color:#9aa3b2;font-size:14.5px;line-height:1.45}
.sperre p.fehler{color:#ec6a6f}
.sperre input{width:100%;box-sizing:border-box;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.12);
              background:#161920;color:#eceff4;font:16px -apple-system,system-ui,sans-serif;outline:none}
.sperre input:focus{border-color:#6f9dfa}
.sperre button{margin-top:12px;width:100%;padding:14px 16px;border-radius:14px;background:#eceff4;color:#0d0f13;
               font:600 16px -apple-system,system-ui,sans-serif;border:0;cursor:pointer}
.sperre button:disabled{opacity:.6}
.sperre small{display:block;margin-top:18px;color:#6b7483;font-size:12.5px;line-height:1.45}
.sperre .diagnose{margin-top:14px;text-align:left;color:#6b7483;font-size:12px}
.sperre .diagnose summary{cursor:pointer;text-align:center;list-style:none}
.sperre .diagnose summary::-webkit-details-marker{display:none}
.sperre .diagnose pre{white-space:pre-wrap;word-break:break-word;max-height:38vh;overflow:auto;margin:8px 0 0;padding:10px;
                     border-radius:10px;background:#161920;color:#9aa3b2;font:11px/1.45 ui-monospace,Menlo,monospace;user-select:text;-webkit-user-select:text}
</style>
<title>Productivity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700&display=swap">
<style>
/* ---------------------------------------------------------------------
   Productivity - die App zum Dashboard.
   Eine Welt, bewusst nur dunkel: Graphit wie die Handy-Seite, Farbe nur
   fuer Status. Saira fuer Zahlen und Titel greift die eckigen Formen des
   GO-ROUND-Logos auf; Fliesstext in der Systemschrift (SF auf dem iPhone),
   damit es sich wie eine iOS-App anfuehlt.
   --------------------------------------------------------------------- */
:root{
  color-scheme:dark;
  --grund:#0d0f13; --flaeche:#161920; --flaeche2:#1d2129; --flaeche3:#242933;
  --rand:rgba(255,255,255,.075); --linie:rgba(255,255,255,.06);
  --text:#eceff4; --leise:#9aa3b2; --sehrleise:#6b7483;
  --blau:#6f9dfa; --gruen:#4fc38f; --gelb:#e2a849; --rot:#ec6a6f;
  --anzeige:"Saira",-apple-system,"SF Pro Display",system-ui,"Segoe UI",sans-serif;
  --lese:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --leiste:64px;
}
html{background:var(--grund)}
body{margin:0;background:var(--grund);color:var(--text);font:15px/1.42 var(--lese);-webkit-font-smoothing:antialiased;
     -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,.zeile:focus-visible,.kachel:focus-visible{outline:2px solid var(--blau);outline-offset:2px}

.huelle{max-width:640px;margin:0 auto;padding-inline:16px;
        padding-block:0 calc(var(--leiste) + 28px + env(safe-area-inset-bottom,0px))}

/* --- Kopf ----------------------------------------------------------- */
.kopf{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:12px 16px 12px;
      background:linear-gradient(180deg,var(--grund) 70%,rgba(13,15,19,0));display:flex;align-items:center;gap:12px}
.kopf img{height:30px;width:auto;flex:none;display:block}
.kopf .name{flex:1;min-width:0}
.kopf .name b{display:block;font:600 19px/1.1 var(--anzeige);letter-spacing:.01em}
.kopf .name span{display:block;font-size:12.5px;color:var(--leise);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.neu{flex:none;width:38px;height:38px;border-radius:50%;background:var(--flaeche);border:1px solid var(--rand);
     display:grid;place-items:center}
.neu svg{width:18px;height:18px;stroke:var(--leise)}
.neu.dreht svg{animation:dreh 1s linear infinite}
@keyframes dreh{to{transform:rotate(360deg)}}

.hinweis{margin:4px 0 14px;padding:12px 14px;border-radius:14px;font-size:13.5px;line-height:1.45;
         background:var(--flaeche);border:1px solid var(--rand);color:var(--leise)}
.hinweis b{color:var(--text)}
.hinweis.gelb{background:rgba(226,168,73,.1);border-color:rgba(226,168,73,.3);color:#efd6aa}
.hinweis.rot{background:rgba(236,106,111,.1);border-color:rgba(236,106,111,.32);color:#f4c2c4}
.hinweis button{margin-top:10px;padding:8px 14px;border-radius:10px;background:var(--flaeche3);color:var(--text);font-weight:600;font-size:13.5px}

/* --- Bausteine ------------------------------------------------------ */
.titel{font:600 26px/1.15 var(--anzeige);letter-spacing:-.005em;margin:14px 2px 4px;text-wrap:balance}
.unter{font-size:13.5px;color:var(--leise);margin:0 2px 14px}
.abschnitt{display:flex;align-items:baseline;justify-content:space-between;margin:24px 4px 9px;
           font-size:12px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:var(--sehrleise)}
.abschnitt span{letter-spacing:0;text-transform:none;font-weight:500;font-size:13px}

.lage{display:flex;gap:14px;align-items:center;padding:16px 16px;border-radius:18px;background:var(--flaeche);border:1px solid var(--rand)}
.lage .punkt{flex:none;width:12px;height:12px;border-radius:50%}
.lage b{display:block;font:600 20px/1.2 var(--anzeige)}
.lage span{display:block;font-size:13px;color:var(--leise);margin-top:2px}

.meldung{display:flex;gap:12px;padding:12px 14px;border-radius:14px;background:var(--flaeche);border:1px solid var(--rand);font-size:14px;line-height:1.42}
.meldung + .meldung{margin-top:8px}
.meldung .strich{flex:none;width:3px;border-radius:3px}

.kacheln{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kachel{position:relative;text-align:left;padding:13px 14px 14px;border-radius:16px;background:var(--flaeche);border:1px solid var(--rand)}
.kachel:active{background:var(--flaeche2)}
.kachel .was{font-size:11.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--sehrleise)}
.kachel .zahl{font:600 34px/1.1 var(--anzeige);font-variant-numeric:tabular-nums;margin-top:4px;letter-spacing:-.01em}
.kachel .zu{font-size:12.5px;color:var(--leise);line-height:1.3;margin-top:1px}
.kachel .punkt{position:absolute;top:15px;right:14px;width:8px;height:8px;border-radius:50%}

.liste{border-radius:16px;background:var(--flaeche);border:1px solid var(--rand);overflow:hidden}
.zeile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;min-height:56px}
.zeile + .zeile{border-top:1px solid var(--linie)}
.zeile:active{background:var(--flaeche2)}
.zeile .mitte{flex:1;min-width:0}
.zeile .haupt{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.zeile .neben{font-size:12.5px;color:var(--leise);margin-top:2px;overflow-wrap:anywhere}
.zeile .rechts{flex:none;text-align:right}
.zeile .pfeil{flex:none;width:8px;height:8px;border-right:2px solid var(--sehrleise);border-top:2px solid var(--sehrleise);transform:rotate(45deg);margin-left:2px}
.leer{padding:22px 16px;text-align:center;color:var(--sehrleise);font-size:14px}

.tage{font:600 22px/1 var(--anzeige);font-variant-numeric:tabular-nums}
.tage small{font:500 12px var(--lese);color:var(--leise);margin-left:2px}
.balken{height:4px;border-radius:4px;background:rgba(255,255,255,.07);margin-top:8px;overflow:hidden}
.balken i{display:block;height:100%;border-radius:4px}

.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.c-rot{color:var(--rot);background:rgba(236,106,111,.14)} .c-gelb{color:var(--gelb);background:rgba(226,168,73,.13)}
.c-gruen{color:var(--gruen);background:rgba(79,195,143,.13)} .c-blau{color:#a9c3f7;background:rgba(111,157,250,.12)}
.c-grau{color:var(--leise);background:rgba(255,255,255,.06)}
.t-rot{color:var(--rot)} .t-gelb{color:var(--gelb)} .t-gruen{color:var(--gruen)}
.b-rot{background:var(--rot)} .b-gelb{background:var(--gelb)} .b-gruen{background:var(--gruen)} .b-grau{background:#5b6472}

.filter{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;padding:7px 13px;border-radius:999px;background:var(--flaeche);border:1px solid var(--rand);color:var(--leise);font-size:13.5px;font-weight:550}
.filter button[aria-pressed="true"]{background:var(--text);color:var(--grund);border-color:var(--text)}

.mono{font-family:var(--mono);font-size:12px;color:var(--sehrleise)}

/* --- Reiterleiste --------------------------------------------------- */
.reiter{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;
        padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
        background:rgba(18,20,26,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--rand)}
.reiter .innen{display:flex;width:100%;max-width:640px}
.reiter button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--sehrleise);font-size:10.5px;font-weight:600;position:relative}
.reiter button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.reiter button[aria-selected="true"]{color:var(--blau)}
.reiter .zaehler{position:absolute;top:1px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;
                 background:var(--rot);color:#fff;font-size:10.5px;line-height:17px;font-weight:700}

/* --- Detailblatt ---------------------------------------------------- */
.schleier{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);opacity:0;transition:opacity .2s}
.schleier.auf{opacity:1}
.blatt{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88%;overflow:auto;margin:0 auto;max-width:640px;
       background:var(--flaeche);border-radius:22px 22px 0 0;border:1px solid var(--rand);border-bottom:0;
       padding:8px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.blatt.auf{transform:none}
.blatt .griff{width:38px;height:5px;border-radius:3px;background:var(--flaeche3);margin:4px auto 10px}
.blatt .zu{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:var(--flaeche2);display:grid;place-items:center;color:var(--leise);font-size:18px;line-height:1}
.blatt h2{font:600 22px/1.2 var(--anzeige);margin:6px 40px 4px 0;text-wrap:balance}
.blatt .sub{font-size:13.5px;color:var(--leise);margin-bottom:14px}
.felder{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:0;font-size:14px}
.felder dt{color:var(--leise)} .felder dd{margin:0;text-align:right;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.ring{--p:0;--f:var(--gruen);width:118px;height:118px;border-radius:50%;margin:6px auto 16px;display:grid;place-items:center;
      background:conic-gradient(var(--f) calc(var(--p)*1%), rgba(255,255,255,.07) 0)}
.ring > div{width:94px;height:94px;border-radius:50%;background:var(--flaeche);display:grid;place-items:center;text-align:center}
.ring b{display:block;font:600 34px/1 var(--anzeige)} .ring span{font-size:12px;color:var(--leise)}
.zeitstrahl{position:relative;margin:4px 0 0 6px;padding-left:18px;border-left:2px solid var(--flaeche3)}
.zeitstrahl .punkt{position:relative;padding:4px 0 12px}
.zeitstrahl .punkt::before{content:"";position:absolute;left:-24px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--blau)}
.zeitstrahl b{font-size:14px} .zeitstrahl div div{font-size:12.5px;color:var(--leise)}
.proto{font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--leise);background:var(--grund);border-radius:12px;padding:10px 12px;overflow-x:auto;white-space:pre}
.kopieren{margin-left:8px;padding:3px 9px;border-radius:8px;background:var(--flaeche3);font-size:12px;color:var(--leise)}

/* --- Verlauf: aufklappbare Commits ---------------------------------- */
details.cm + details.cm{border-top:1px solid var(--linie)}
details.cm > summary{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:11px 14px;cursor:pointer}
details.cm > summary::-webkit-details-marker{display:none}
details.cm > summary:active{background:var(--flaeche2)}
details.cm .was{flex:1;min-width:0;font-weight:550;font-size:14.5px;overflow-wrap:anywhere}
details.cm .wann{flex:none;text-align:right;font-size:12px;color:var(--leise);font-variant-numeric:tabular-nums}
details.cm .plus{color:var(--gruen)} details.cm .minus{color:var(--rot)}
details.cm .koerper{padding:0 14px 14px;font-size:13.5px;color:var(--leise)}
.text p{margin:6px 0;line-height:1.5}
.suche{width:100%;box-sizing:border-box;padding:11px 14px;border-radius:12px;border:1px solid var(--rand);background:var(--grund);color:var(--text);
       font:16px var(--lese);outline:none;margin:2px 0 4px}
.suche:focus{border-color:var(--blau)}

@media (prefers-reduced-motion:reduce){.blatt,.schleier{transition:none}.neu.dreht svg{animation:none}}
</style>

</head>

<div class="sperre" id="sperre" hidden>

    <h1>Productivity</h1>
    <p id="sperre-text">Einmal das App-Passwort eingeben.</p>
    <input type="text" name="username" value="Productivity" autocomplete="username" hidden>
    <input id="sperre-passwort" type="password" name="password" autocomplete="current-password" placeholder="App-Passwort" required>
    <button type="submit">Entsperren</button>
    <small>Die Daten liegen verschlüsselt im Netz und werden erst auf diesem Gerät entschlüsselt. Das Passwort legst du am PC fest.</small>
    <details class="diagnose"><summary>Diagnose</summary><pre id="diagnose"></pre></details>
  </form>
</div>
<script>
// Steht vor dem Hauptskript und ist absichtlich altmodisch geschrieben, damit
// es auch dann laeuft, wenn das Hauptskript in einem Browser scheitert.
(function(){
  // ---- Diagnose: die letzten Schritte, auf dem Geraet gemerkt -----------
  // Laesst sich auf dem Sperrbildschirm aufklappen. Enthaelt nie das
  // Passwort, nur Schritte, Laengen und Fehlermeldungen.
  var DIAG = "productivity-diagnose";
  function zeige(){
    var p = document.getElementById("diagnose"); if (!p) return;
    try { p.textContent = JSON.parse(localStorage.getItem(DIAG) || "[]").join("\n"); } catch(e){ p.textContent = "(kein Speicher: " + e.message + ")"; }
  }
  window.pdNotiz = function(t){
    try {
      var l = JSON.parse(localStorage.getItem(DIAG) || "[]"), d = new Date();
      l.push(("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2) + ":" + ("0" + d.getSeconds()).slice(-2) + " " + t);
      localStorage.setItem(DIAG, JSON.stringify(l.slice(-30)));
    } catch(e){}
    zeige();
  };
  var laeuft = null; try { laeuft = sessionStorage.getItem("pd-entsperren"); sessionStorage.removeItem("pd-entsperren"); } catch(e){}
  pdNotiz("Seite geladen" + (navigator.standalone ? " (Home-Bildschirm)" : "") + (laeuft ? " - NEU GELADEN WAEHREND ENTSPERREN (seit " + laeuft + ")" : ""));

  // Ein Passwort, das je in der Adresse gelandet ist, sofort wieder entfernen.
  if (/[?&]password=/.test(location.search)) { pdNotiz("Passwort stand in der Adresse - entfernt"); try { history.replaceState(null, "", location.pathname); } catch(e){} }
  function melde(t){
    pdNotiz("Skriptfehler: " + t);
    var s = document.getElementById("sperre"), p = document.getElementById("sperre-text");
    if (!s || !p) return;
    s.hidden = false; p.className = "fehler";
    p.textContent = "Dieser Browser kann die App nicht ausführen: " + t;
  }
  window.addEventListener("error", function(e){ melde(e.message || "Skriptfehler"); });
  window.addEventListener("unhandledrejection", function(e){ pdNotiz("Unbehandelt: " + (e.reason && (e.reason.message || e.reason.code) || e.reason)); });
  if (!window.crypto || !window.crypto.subtle) melde("keine Verschlüsselung verfügbar (nur über https:// möglich).");
})();
</script>

<script>
(function(){
  "use strict";

  // Datei und Weg: Der PC schreibt sie alle 5 Minuten nach Google Drive
  // (Meine Ablage/Productivity), diese Seite liest sie ueber den Google-
  // Drive-Connector des Betrachters. Kein Server, kein Modellaufruf.
  const DATEI = "Productivity-Daten.json";
  const DRIVE = "Google Drive";
  const MERK  = "productivity-app-v1";

  const $ = (s) => document.querySelector(s);
  const inhalt = $("#inhalt"), hinweis = $("#hinweis"), standEl = $("#stand"), neuKnopf = $("#neu");
  let daten = null, reiter = "uebersicht", filter = {lizenzen:"alle", postfach:"offen", backlog:"alle"};
  let mcp = null, dateiId = null, laedt = false;

  // ---- kleine Helfer --------------------------------------------------
  const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const merk = { lies(){ try { return JSON.parse(localStorage.getItem(MERK) || "{}"); } catch(e){ return {}; } },
                 schreib(o){ try { localStorage.setItem(MERK, JSON.stringify(Object.assign(merk.lies(), o))); } catch(e){} } };
  const datum = (iso) => { if(!iso) return null; const d = new Date(iso); return isNaN(d) ? null : d; };
  const fmt = (iso, mitZeit) => { const d = datum(iso); if(!d) return "–";
    const t = d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
    return mitZeit ? t + ", " + d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) : t; };
  const vor = (iso) => { const d = datum(iso); if(!d) return ""; const m = Math.round((Date.now()-d)/60000);
    if(m < 1) return "gerade eben"; if(m < 60) return "vor " + m + " Min"; if(m < 1440) return "vor " + Math.floor(m/60) + " Std";
    return "vor " + Math.floor(m/1440) + " Tg"; };
  const ton = (tage) => tage == null ? "grau" : (tage <= 7 ? "rot" : (tage <= 30 ? "gelb" : "gruen"));
  const tageText = (t) => t == null ? "?" : (t < 0 ? Math.abs(t) + " Tg drüber" : (t === 0 ? "heute" : (t === 1 ? "morgen" : t + " Tage")));
  const alterText = (t) => t === 0 ? "heute" : (t === 1 ? "gestern" : t + " Tg");

  // ---- Verlauf (Releases und Commit-Geschichte, seit 27.09.) -------------
  const arr = (x) => Array.isArray(x) ? x : (x == null ? [] : [x]);
  const vl = () => (daten && daten.Verlauf) || {};
  const vlRelease = (k) => arr(vl().Releases).find(r => r.Schluessel === k);
  const vlRepo = (n) => arr(vl().Repos).find(r => r.Name === n);
  const istNeu = (c) => c.Release === -1 || c.Release === "-1";
  const releaseName = (k) => { if(k === -1 || k === "-1") return "noch nicht veröffentlicht"; if(k == null) return "vor dem ältesten bekannten Release";
    const r = vlRelease(k); return r ? (r.Version || "?") + " vom " + fmt(r.Datum, true) : String(k); };
  // git bricht Commit-Texte bei ~72 Zeichen um - Absaetze wieder zusammenfuegen
  const absaetze = (t) => String(t || "").split(/\n\s*\n/).map(a => {
    const raus = [];
    a.split("\n").forEach(z => { if(!raus.length || /^\s*([-*•]|\d+[.)])\s+/.test(z)) raus.push(z.trim()); else raus[raus.length - 1] += " " + z.trim(); });
    return "<p>" + raus.map(esc).join("<br>") + "</p>";
  }).join("");
  const commitZeile = (c, repo) => {
    const d = datum(c.Datum), wann = d ? d.toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit"}) : "";
    const umfang = c.Dateien ? '<br><span class="plus">+' + (c.Plus || 0) + '</span> <span class="minus">−' + (c.Minus || 0) + "</span>" : "";
    const stand = c.Stand ? ' <span class="chip ' + (/ungetestet|offen|unklar/.test(c.Stand) ? "c-gelb" : (/getestet/.test(c.Stand) ? "c-gruen" : "c-grau")) + '">' + esc(c.Stand) + "</span>" : "";
    return '<details class="cm" data-suche="' + esc((c.Hash + " " + c.Inhalt + " " + (c.Betreff || "") + " " + (c.Text || "")).toLowerCase()) + '"><summary><div class="was">' + esc(c.Inhalt) + stand +
      '</div><div class="wann">' + esc(wann) + umfang + '</div></summary><div class="koerper">' +
      (c.Betreff && c.Betreff !== c.Inhalt ? "<p>Commit-Nachricht: " + esc(c.Betreff) + "</p>" : "") + (c.Text ? '<div class="text">' + absaetze(c.Text) + "</div>" : "") +
      '<div class="mono" style="margin-top:8px">' + esc(repo) + " · " + esc(c.Hash) + " · " + fmt(c.Datum, true) + (c.Dateien ? " · " + c.Dateien + " Dateien" : "") + "</div></div></details>";
  };

  // ---- Laden (Web-App) -------------------------------------------------
  // Ersetzt beim Bauen den Lade-Teil der gemeinsamen Vorlage. Statt ueber
  // den Google-Drive-Connector kommt die Datei hier vom selben Ort wie die
  // Seite - VERSCHLUESSELT. Entschluesselt wird nur im Browser.
  //
  // Format (Dashboard-App.ps1 schreibt es):
  //   {v:1, iter, salt, iv, ct, mac}  - alles Base64
  //   Schluessel = PBKDF2-SHA256(Passwort, salt, iter) -> 64 Byte:
  //                32 fuer AES-256-CBC, 32 fuer HMAC-SHA256
  //   mac = HMAC("PRODUCTIVITY-1" | salt | iv | ct)
  // Die Pruefsumme kommt ZUERST: ein falsches Passwort faellt dort auf,
  // bevor irgendetwas entschluesselt wird.
  //
  // Gemerkt wird nicht das Passwort, sondern ein nicht auslesbarer
  // Schluessel (CryptoKey, extractable: false) in IndexedDB. Wird das
  // Passwort am PC geaendert, passt er nicht mehr, und die App fragt neu.
  const DB = "productivity-app", ABLAGE = "schluessel";
  let basis = null, entsperrt = false;
  const notiz = (t) => { try { window.pdNotiz && window.pdNotiz(t); } catch(e){} };
  // IndexedDB haengt in iOS-Web-Apps gelegentlich, ohne je zu antworten.
  // Deshalb jede Speicheroperation mit Zeitgrenze - lieber einmal zu oft
  // nach dem Passwort fragen als ewig warten.
  const hoechstens = (p, ms, ersatz, name) => new Promise((ok, nein) => {
    const uhr = setTimeout(() => { notiz(name + ": keine Antwort nach " + ms + " ms"); ok(ersatz); }, ms);
    Promise.resolve(p).then((w) => { clearTimeout(uhr); ok(w); }, (e) => { clearTimeout(uhr); nein(e); });
  });

  function idb(){
    return new Promise((ok, nein) => {
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(ABLAGE);
      r.onsuccess = () => ok(r.result); r.onerror = () => nein(r.error);
    });
  }
  async function schluesselLesen(){
    try { const d = await idb(); return await new Promise((ok) => { const t = d.transaction(ABLAGE).objectStore(ABLAGE).get("basis"); t.onsuccess = () => ok(t.result || null); t.onerror = () => ok(null); }); }
    catch(e){ return null; }
  }
  async function schluesselMerken(k){
    try { const d = await idb(); await new Promise((ok) => { const t = d.transaction(ABLAGE, "readwrite"); t.objectStore(ABLAGE).put(k, "basis"); t.oncomplete = ok; t.onerror = ok; }); } catch(e){}
  }
  async function schluesselVergessen(){
    try { const d = await idb(); await new Promise((ok) => { const t = d.transaction(ABLAGE, "readwrite"); t.objectStore(ABLAGE).delete("basis"); t.oncomplete = ok; t.onerror = ok; }); } catch(e){}
  }

  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function entschluesseln(env, basisKey){
    const salt = b64(env.salt), iv = b64(env.iv), ct = b64(env.ct), mac = b64(env.mac);
    const bits = new Uint8Array(await crypto.subtle.deriveBits({name: "PBKDF2", salt, iterations: env.iter, hash: "SHA-256"}, basisKey, 512));
    const aes = await crypto.subtle.importKey("raw", bits.slice(0, 32), {name: "AES-CBC"}, false, ["decrypt"]);
    const hm  = await crypto.subtle.importKey("raw", bits.slice(32), {name: "HMAC", hash: "SHA-256"}, false, ["verify"]);
    const kopf = new TextEncoder().encode("PRODUCTIVITY-1");
    const alles = new Uint8Array(kopf.length + salt.length + iv.length + ct.length);
    alles.set(kopf, 0); alles.set(salt, kopf.length); alles.set(iv, kopf.length + salt.length); alles.set(ct, kopf.length + salt.length + iv.length);
    if(!(await crypto.subtle.verify("HMAC", hm, mac, alles))) throw {code: "falsches_passwort"};
    const klar = await crypto.subtle.decrypt({name: "AES-CBC", iv}, aes, ct);
    // z: "gzip" = vor dem Verschluesseln gepackt (seit dem Verlauf, 27.09.)
    if(env.z === "gzip"){
      const strom = new Blob([klar]).stream().pipeThrough(new DecompressionStream("gzip"));
      return JSON.parse(await new Response(strom).text());
    }
    return JSON.parse(new TextDecoder("utf-8").decode(klar));
  }

  async function holeUmschlag(){
    const r = await fetch("daten.enc?t=" + Date.now(), {cache: "no-store"});
    if(r.status === 404) throw {code: "datei_fehlt"};
    if(!r.ok) throw {code: "netz"};
    return r.json();
  }

  async function laden(ausKnopf){
    if(laedt) return; laedt = true; neuKnopf.classList.add("dreht");
    let mit = null;
    try{
      if(!basis){ const g = await hoechstens(schluesselLesen(), 4000, null, "Schlüssel lesen"); if(!basis) basis = g; notiz("Laden: gemerkter Schlüssel " + (basis ? "da" : "fehlt")); }
      if(!basis){ if(!entsperrt) zeigeSperre(); return; }
      mit = basis;
      const neu = await entschluesseln(await holeUmschlag(), mit);
      daten = neu; hinweis.innerHTML = ""; zeichne();
      if(ausKnopf !== false || !entsperrt) notiz("Laden: entschlüsselt und angezeigt");
      entsperrt = true;
    } catch(e){
      notiz("Laden: " +((e && (e.code || e.message)) || e));
      // Nur zuruecksetzen, wenn es noch derselbe Schluessel ist - wurde
      // inzwischen am Sperrbildschirm entsperrt, gilt der neue.
      if(e && e.code === "falsches_passwort" && basis === mit){
        basis = null; entsperrt = false; await hoechstens(schluesselVergessen(), 3000, null, "Schlüssel löschen"); daten = null; zeichne();
        zeigeSperre("Das gespeicherte Passwort passt nicht mehr - es wurde vermutlich am PC geändert.");
      } else if(e && e.code === "falsches_passwort"){
        // veralteter Lauf, nichts tun
      } else {
        zeigeHinweis(e && e.code ? e.code : (e instanceof TypeError ? "netz" : "unbekannt"), e && e.message);
      }
    } finally { laedt = false; neuKnopf.classList.remove("dreht"); }
  }

  function zeigeHinweis(code, text){
    const alt = daten ? " Unten steht der zuletzt geladene Stand." : "";
    const k = {
      datei_fehlt: ["gelb", "<b>Noch keine Daten veröffentlicht.</b> Der PC lädt sie hoch, sobald dort das App-Passwort eingerichtet ist."],
      netz: ["gelb", "<b>Keine Verbindung.</b>", true],
    }[code] || ["rot", "<b>Laden fehlgeschlagen.</b> " + esc(text || code), true];
    hinweis.innerHTML = '<div class="hinweis ' + k[0] + '">' + k[1] + esc(alt) + (k[2] ? '<br><button id="nochmal">Erneut laden</button>' : "") + "</div>";
    const n = document.getElementById("nochmal"); if(n) n.onclick = () => laden(true);
  }

  // ---- Sperrbildschirm --------------------------------------------------
  const sperre = document.getElementById("sperre"), sperreForm = document.getElementById("sperre-form"),
        sperreFeld = document.getElementById("sperre-passwort"), sperreText = document.getElementById("sperre-text");
  function zeigeSperre(meldung){
    notiz("Sperrbildschirm" + (meldung ? ": " + meldung.slice(0, 40) : ""));
    sperre.hidden = false;
    sperreText.textContent = meldung || "Einmal das App-Passwort eingeben. Danach öffnet sich die App auf diesem iPhone direkt.";
    sperreText.className = meldung ? "fehler" : "";
    setTimeout(() => sperreFeld.focus(), 60);
  }
  sperreForm.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const knopf = sperreForm.querySelector("button");
    if(knopf.disabled) return;   // doppelt abgeschickt (Enter + Tippen)
    knopf.disabled = true; knopf.textContent = "Prüfe …";
    const pw = sperreFeld.value;
    notiz("Entsperren: " + pw.length + " Zeichen");
    try { sessionStorage.setItem("pd-entsperren", new Date().toLocaleTimeString("de-DE")); } catch(e){}
    try{
      const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
      const umschlag = await holeUmschlag();
      notiz("Entsperren: Daten geholt (" + String(umschlag.ct || "").length + " Zeichen)");
      const neu = await entschluesseln(umschlag, k);
      notiz("Entsperren: entschlüsselt");
      basis = k; entsperrt = true;
      sperreFeld.value = ""; sperre.hidden = true;
      daten = neu; hinweis.innerHTML = "";
      try { zeichne(); notiz("Entsperren: angezeigt"); } catch(e){ notiz("Anzeigen fehlgeschlagen: " + e.message); throw e; }
      // Merken erst danach und ohne darauf zu warten: Haengt IndexedDB,
      // ist die App trotzdem offen - sie fragt dann nur beim naechsten Start.
      hoechstens(schluesselMerken(k), 4000, null, "Schlüssel merken").then(() => notiz("Entsperren: Schlüssel gemerkt"), (e) => notiz("Schlüssel merken: " + (e && e.message || e)));
    } catch(e){
      notiz("Entsperren fehlgeschlagen: " + ((e && (e.code || e.message)) || e));
      sperre.hidden = false;
      sperreText.className = "fehler";
      sperreText.textContent = e && e.code === "falsches_passwort" ? "Das Passwort stimmt nicht."
        : e && e.code === "datei_fehlt" ? "Noch keine Daten veröffentlicht - erst am PC das App-Passwort einrichten."
        : e && e.code === "netz" || e instanceof TypeError && /fetch|network|load/i.test(e.message || "") ? "Keine Verbindung - bitte noch einmal versuchen."
        : "Fehler beim Entsperren: " + ((e && (e.message || e.name || e.code)) || String(e));
      sperreFeld.select();
    } finally {
      knopf.disabled = false; knopf.textContent = "Entsperren";
      try { sessionStorage.removeItem("pd-entsperren"); } catch(e){}
    }
  });

  // ---- Zeichnen -------------------------------------------------------
  function kopfStand(){
    if(!daten){ return; }
    const alt = (Date.now() - datum(daten.Stand)) / 60000;
    standEl.textContent = "Stand " + fmt(daten.Stand, true).split(", ")[1] + " · " + vor(daten.Stand) + (alt > 30 ? " · PC seitdem aus" : "");
    standEl.style.color = alt > 30 ? "var(--gelb)" : "";
  }

  function zahlen(){
    const lz = daten.Lizenzen || [];
    const mails = (daten.Postfach && daten.Postfach.Mails) || [];
    const offen = mails.filter(m => !m.Intern && !m.Beantwortet);
    const beta = (daten.Releases && daten.Releases.SeitRelease || []).reduce((s,r) => s + (r.Commits||[]).length, 0);
    return {lz, mails, offen, beta, faellig: lz.filter(l => l.Tage != null && l.Tage <= 30), bl: (daten.Backlog && daten.Backlog.Offen) || []};
  }

  function zeichne(){
    if(!daten){ inhalt.innerHTML = '<div class="leer" style="padding-top:60px">Lädt …</div>'; return; }
    kopfStand();
    const z = zahlen();
    // Zaehler an den Reitern
    document.querySelectorAll(".reiter .zaehler").forEach(e => e.remove());
    const marke = {postfach: z.offen.length, lizenzen: z.lz.filter(l => l.Tage != null && l.Tage <= 7).length};
    for(const k in marke){ if(marke[k] > 0){ const b = document.querySelector('[data-reiter="' + k + '"]'); if(b){ const s = document.createElement("span"); s.className = "zaehler"; s.textContent = marke[k]; b.appendChild(s); } } }
    ({uebersicht, lizenzen, postfach, backlog, releases})[reiter](z);
  }

  function uebersicht(z){
    const lage = daten.Lage || {};
    const t = lage.Rot ? (lage.Rot === 1 ? "1 Sache ist dringend" : lage.Rot + " Sachen sind dringend")
            : lage.Gelb ? (lage.Gelb === 1 ? "1 Punkt zum Ansehen" : lage.Gelb + " Punkte zum Ansehen") : "Alles ruhig";
    const sub = lage.Rot && lage.Gelb ? "dazu " + lage.Gelb + " zum Ansehen" : (lage.Stufe === "gruen" ? "Nichts wartet auf eine Entscheidung." : "");
    let h = '<div class="lage"><span class="punkt b-' + esc(lage.Stufe || "grau") + '"></span><div><b>' + esc(t) + "</b>" + (sub ? "<span>" + esc(sub) + "</span>" : "") + "</div></div>";
    const al = daten.Alarme || [];
    if(al.length){ h += '<div style="margin-top:10px">' + al.map(a => '<div class="meldung"><span class="strich b-' + esc(a.Stufe) + '"></span><div>' + esc(a.Text) + "</div></div>").join("") + "</div>"; }

    const naechste = z.lz.find(l => l.Tage != null);
    const kach = [
      ["lizenzen", "Lizenzen", z.lz.length, z.lz.filter(l => l.Art === "Test").length + " Test · " + z.lz.filter(l => l.Art && l.Art !== "Test").length + " Voll", "grau"],
      ["lizenzen", "Verlängern", z.faellig.length, naechste ? "zuerst " + naechste.Firma.split(/[\s-]/)[0] + " in " + naechste.Tage + " Tg" : "", z.faellig.some(l => l.Tage <= 7) ? "rot" : (z.faellig.length ? "gelb" : "gruen")],
      ["postfach", "Postfach", z.offen.length, z.offen.length ? "älteste " + Math.max(...z.offen.map(m => m.AlterTage)) + " Tg" : "nichts offen", z.offen.length ? "gelb" : "gruen"],
      ["uebersicht-freigaben", "Freigaben", (daten.Freigaben || []).length, "warten auf ein Ja", (daten.Freigaben || []).length ? "gelb" : "gruen"],
      ["backlog", "Backlog", z.bl.length, "Prio 1: " + z.bl.filter(b => b.Prio === "1").length + " · Prio 2: " + z.bl.filter(b => b.Prio === "2").length, z.bl.some(b => b.Prio === "1") ? "gelb" : "grau"],
      ["releases", "Beta", z.beta, "seit " + ((daten.Releases && daten.Releases.Online && daten.Releases.Online.Version) || "Release"), "grau"],
    ];
    h += '<div class="abschnitt">Überblick</div><div class="kacheln">' + kach.map(k =>
      '<button class="kachel" data-geh="' + k[0] + '"><span class="punkt ' + (k[4] === "grau" ? "" : "b-" + k[4]) + '"></span><div class="was">' + esc(k[1]) + '</div><div class="zahl' + (k[4] === "rot" || k[4] === "gelb" ? " t-" + k[4] : "") + '">' + esc(k[2]) + '</div><div class="zu">' + esc(k[3]) + "</div></button>").join("") + "</div>";

    const s = daten.System || {}, rob = s.Roboter || {}, si = s.Sicherung || {}, rep = s.Repos || [], rel = daten.Releases || {};
    const robTon = !rob.Ok || rob.LetzterMitFehler ? "rot" : (rob.FehlerIn24 ? "gelb" : "gruen");
    const sichTage = si.Datum ? Math.floor((Date.now() - datum(si.Datum)) / 864e5) : null;
    const sichTon = !si.SchluesselGesichert ? "rot" : (sichTage != null && sichTage > 14 ? "gelb" : "gruen");
    const sauber = rep.filter(r => !r.Geaendert && !r.NichtGepusht && !r.Rueckstand && !r.OffenePRs).length;
    const gleich = rel.Online && rel.Gebaut && rel.Online.Version === rel.Gebaut.Version;
    h += '<div class="abschnitt">System</div><div class="liste">' +
      zeileSys("roboter", "LizenzRoboter", robTon === "gruen" ? "läuft" : (robTon === "gelb" ? "holpert" : "Fehler"), "zuletzt " + (rob.LetzterLauf ? fmt(rob.LetzterLauf, true).split(", ")[1] : "–"), robTon) +
      zeileSys("sicherung", "Sicherung", sichTage == null ? "unbekannt" : (sichTage === 0 ? "heute" : "vor " + sichTage + " Tg"), si.SchluesselGesichert ? "Schlüssel gesichert" : "Schlüssel prüfen", sichTon) +
      zeileSys("repos", "Repos", sauber + " von " + rep.length + " sauber", rep.filter(r => r.Geaendert || r.NichtGepusht || r.Rueckstand || r.OffenePRs).map(r => r.Name).join(", ") || "alles aktuell", sauber === rep.length ? "gruen" : "gelb") +
      zeileSys("releases-sheet", "Auslieferung", (rel.Online && rel.Online.Version) || "?", gleich ? "online = gebaut" : "gebaut ist neuer", gleich ? "gruen" : "gelb") +
      "</div>";
    inhalt.innerHTML = h;
  }
  function zeileSys(ziel, was, wert, neben, t){
    return '<button class="zeile" data-blatt="' + ziel + '"><span class="punkt b-' + t + '" style="width:10px;height:10px;border-radius:50%;flex:none"></span><div class="mitte"><div class="haupt">' + esc(was) + '</div><div class="neben">' + esc(neben) + '</div></div><div class="rechts" style="font-weight:600">' + esc(wert) + '</div><span class="pfeil"></span></button>';
  }

  function filterLeiste(name, werte){
    return '<div class="filter" role="group">' + werte.map(w => '<button data-filter="' + name + '" data-wert="' + w[0] + '" aria-pressed="' + (filter[name] === w[0]) + '">' + esc(w[1]) + "</button>").join("") + "</div>";
  }

  function lizenzen(z){
    let l = z.lz;
    if(filter.lizenzen === "bald") l = l.filter(x => x.Tage != null && x.Tage <= 30);
    if(filter.lizenzen === "test") l = l.filter(x => x.Art === "Test");
    if(filter.lizenzen === "voll") l = l.filter(x => x.Art && x.Art !== "Test");
    let h = '<div class="titel">Lizenzen</div><div class="unter">Nach Restlaufzeit sortiert. Antippen für Historie und offene Mails.</div>' +
      filterLeiste("lizenzen", [["alle","Alle " + z.lz.length],["bald","≤ 30 Tage " + z.faellig.length],["test","Test"],["voll","Vollversion"]]);
    h += '<div class="liste">' + (l.length ? l.map((x) => {
      const t = ton(x.Tage), i = z.lz.indexOf(x);
      const mail = (x.OffeneMails || []).length ? ' <span class="chip c-' + (t === "rot" ? "rot" : "gelb") + '">' + x.OffeneMails.length + " Mail" + (x.OffeneMails.length > 1 ? "s" : "") + "</span>" : "";
      return '<button class="zeile" data-blatt="lizenz:' + i + '"><div class="mitte"><div class="haupt">' + esc(x.Firma) + mail + '</div><div class="neben">' + esc(x.Art || "–") + " · bis " + fmt(x.Ablauf) + (x.Notiz ? " · " + esc(x.Notiz) : "") + '</div><div class="balken"><i class="b-' + t + '" style="width:' + (x.Dringlichkeit || 0) + '%"></i></div></div><div class="rechts"><div class="tage' + (t === "gruen" ? "" : " t-" + t) + '">' + (x.Tage == null ? "?" : (x.Tage < 0 ? Math.abs(x.Tage) : x.Tage)) + "<small>" + (x.Tage != null && x.Tage < 0 ? "drüber" : "Tg") + '</small></div></div><span class="pfeil"></span></button>';
    }).join("") : '<div class="leer">Keine Lizenz in dieser Auswahl.</div>') + "</div>";
    inhalt.innerHTML = h;
  }

  function postfach(z){
    const f = filter.postfach;
    const l = z.mails.filter(m => f === "offen" ? (!m.Intern && !m.Beantwortet) : (f === "beantwortet" ? (!m.Intern && m.Beantwortet) : m.Intern))
                     .sort((a,b) => b.AlterTage - a.AlterTage);
    let h = '<div class="titel">Postfach</div><div class="unter">productivity@go-round.de · Lauf ' + esc(vor(daten.Postfach && daten.Postfach.Lauf)) + "</div>" +
      filterLeiste("postfach", [["offen","Offen " + z.offen.length],["beantwortet","Beantwortet"],["intern","Intern"]]);
    h += '<div class="liste">' + (l.length ? l.map(m => {
      const i = z.mails.indexOf(m), t = m.AlterTage >= 7 ? "rot" : (m.AlterTage >= 2 ? "gelb" : "grau");
      const firma = m.Lizenz ? m.Lizenz.Firma : m.Domaene;
      return '<button class="zeile" data-blatt="mail:' + i + '"><div class="mitte"><div class="haupt">' + esc(m.Betreff) + '</div><div class="neben">' + esc(m.Name || m.Adresse) + " · " + esc(firma) + '</div></div><div class="rechts"><span class="chip c-' + t + '">' + esc(alterText(m.AlterTage)) + '</span></div><span class="pfeil"></span></button>';
    }).join("") : '<div class="leer">' + (f === "offen" ? "Keine unbeantwortete Kundenmail." : "Nichts in dieser Auswahl.") + "</div>") + "</div>";
    if(f === "offen") h += '<div class="unter" style="margin-top:12px">Beim Antworten „Allen antworten" nehmen, dann legt der Roboter die Mail ab.</div>';
    inhalt.innerHTML = h;
  }

  function backlog(z){
    const tools = [...new Set(z.bl.map(b => b.Tool))].sort();
    const f = filter.backlog;
    let l = z.bl;
    if(/^p[123]$/.test(f)) l = l.filter(b => b.Prio === f.slice(1));
    else if(f !== "alle") l = l.filter(b => b.Tool === f);
    let h = '<div class="titel">Backlog</div><div class="unter">' + z.bl.length + " offen · " + esc(daten.Backlog && daten.Backlog.Erledigt) + " erledigt</div>" +
      filterLeiste("backlog", [["alle","Alle"],["p1","Prio 1"],["p2","Prio 2"],["p3","Prio 3"]].concat(tools.map(t => [t, t])));
    const gruppen = {};
    l.forEach(b => { (gruppen[b.Prio] = gruppen[b.Prio] || []).push(b); });
    const namen = {"1":"Prio 1 · Blocker","2":"Prio 2 · vor v1.0","3":"Prio 3 · nach Launch"};
    const keys = Object.keys(gruppen).sort();
    h += keys.length ? keys.map(p => '<div class="abschnitt">' + esc(namen[p] || "Prio " + p) + "<span>" + gruppen[p].length + '</span></div><div class="liste">' + gruppen[p].map(b => {
      const i = z.bl.indexOf(b);
      return '<button class="zeile" data-blatt="backlog:' + i + '"><div class="mitte"><div class="haupt">' + esc(b.Thema) + '</div><div class="neben"><span class="mono">' + esc(b.ID) + "</span> · " + esc(b.Tool) + " · " + esc(b.Art) + '</div></div><div class="rechts"><span class="chip c-grau">' + esc(b.Aufwand || "–") + '</span></div><span class="pfeil"></span></button>';
    }).join("") + "</div>").join("") : '<div class="liste"><div class="leer">Nichts offen in dieser Auswahl.</div></div>';
    inhalt.innerHTML = h;
  }

  function releases(z){
    const r = daten.Releases || {}, on = r.Online || {}, geb = r.Gebaut || {};
    let h = '<div class="titel">Releases</div><div class="unter">Online ' + esc(on.Version || "?") + " seit " + fmt(on.Datum, true) + (geb.Datei ? " · zuletzt gebaut: " + esc(geb.Datei) : "") + "</div>";
    const block = (titel, gruppen, art) => {
      const n = (gruppen || []).reduce((s,g) => s + (g.Commits||[]).length, 0);
      let x = '<div class="abschnitt">' + esc(titel) + "<span>" + n + "</span></div>";
      if(!n) return x + '<div class="liste"><div class="leer">Keine Änderungen.</div></div>';
      return x + (gruppen || []).filter(g => (g.Commits||[]).length).map((g, gi) =>
        '<div class="liste" style="margin-bottom:10px"><div class="zeile" style="min-height:0;padding-block:10px"><div class="mitte"><div class="haupt" style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--sehrleise)">' + esc(g.Repo) + '</div></div><span class="chip ' + (g.Genau ? "c-blau" : "c-grau") + '">' + (g.Genau ? "exakt" : "nach Uhrzeit") + "</span></div>" +
        g.Commits.map((c, ci) => '<button class="zeile" data-blatt="commit:' + art + ":" + esc(g.Repo) + ":" + ci + '"><div class="mitte"><div class="haupt" style="font-weight:550">' + esc(c.Inhalt) + '</div>' + (c.Stand ? '<div class="chips"><span class="chip ' + (/getestet/.test(c.Stand) ? "c-gruen" : (/offen|unklar/.test(c.Stand) ? "c-gelb" : "c-grau")) + '">' + esc(c.Stand) + "</span></div>" : "") + '</div><div class="rechts"><div class="mono">' + esc(c.Hash) + '</div><div class="neben">' + esc(c.Datum) + '</div></div><span class="pfeil"></span></button>').join("") + "</div>").join("");
    };
    h += block("Seit dem Release gebaut", r.SeitRelease, "seit");
    h += block("Im Release " + (on.Version || ""), r.ImRelease, "im");
    // Verlauf: bewusst unten - zum Nachlesen, nicht zum Reagieren
    const v = vl(), rels = arr(v.Releases), reps = arr(v.Repos);
    if(rels.length || reps.length){
      h += '<div class="abschnitt">Verlauf · Releases<span>' + rels.length + "</span></div><div class=\"liste\">" +
        '<button class="zeile" data-blatt="release:neu"><div class="mitte"><div class="haupt">Noch nicht veröffentlicht</div><div class="neben">Beta seit dem letzten Release</div></div><div class="rechts"><span class="chip ' + (v.Unveroeffentlicht ? "c-gelb" : "c-gruen") + '">' + esc(v.Unveroeffentlicht || 0) + '</span></div><span class="pfeil"></span></button>' +
        rels.map(x => '<button class="zeile" data-blatt="release:' + esc(x.Schluessel) + '"><div class="mitte"><div class="haupt">' + esc(x.Version || "?") + (x.Online ? ' <span class="chip c-gruen">online</span>' : "") +
          '</div><div class="neben">' + fmt(x.Datum, true) + " · " + esc(vor(x.Datum)) + '</div></div><div class="rechts">' + (x.Aeltestes ? '<span class="chip c-grau">ältestes</span>' : '<span class="chip c-grau">' + esc(x.Anzahl) + "</span>") + '</div><span class="pfeil"></span></button>').join("") + "</div>";
      h += '<div class="abschnitt">Verlauf · Repos<span>' + reps.length + '</span></div><div class="liste">' +
        reps.map(x => { const neu = arr(x.Commits).filter(istNeu).length, letzter = arr(x.Commits)[0];
          return '<button class="zeile" data-blatt="repo:' + esc(x.Name) + '"><div class="mitte"><div class="haupt">' + esc(x.Name) + '</div><div class="neben">' + esc(x.Gesamt) + " Commits · zuletzt " + esc(letzter ? vor(letzter.Datum) : "–") + '</div></div><div class="rechts">' +
            (!x.ImInstaller ? '<span class="chip c-grau">extern</span>' : (neu ? '<span class="chip c-gelb">' + neu + " neu</span>" : '<span class="chip c-gruen">veröffentlicht</span>')) + '</div><span class="pfeil"></span></button>'; }).join("") + "</div>";
    } else if((r.Frueher || []).length) h += '<div class="unter" style="margin-top:14px">Frühere Releases: ' + r.Frueher.map(d => esc(fmt(d, true))).join(" · ") + "</div>";
    inhalt.innerHTML = h;
  }

  // ---- Detailblaetter --------------------------------------------------
  const blatt = $("#blatt"), schleier = $("#schleier");
  function oeffne(html){
    blatt.innerHTML = '<div class="griff"></div><button class="zu" aria-label="Schließen">×</button>' + html;
    blatt.hidden = false; schleier.hidden = false;
    requestAnimationFrame(() => { blatt.classList.add("auf"); schleier.classList.add("auf"); });
    blatt.querySelector(".zu").focus();
    blatt.scrollTop = 0;
  }
  function schliesse(){
    blatt.classList.remove("auf"); schleier.classList.remove("auf");
    setTimeout(() => { blatt.hidden = true; schleier.hidden = true; }, 240);
  }
  const felder = (paare) => '<dl class="felder">' + paare.filter(p => p[1] != null && p[1] !== "").map(p => "<dt>" + esc(p[0]) + "</dt><dd>" + (p[2] ? p[1] : esc(p[1])) + "</dd>").join("") + "</dl>";

  function blattFuer(schl){
    const z = zahlen();
    const [art, a, b, c] = schl.split(":");
    if(art === "lizenz"){
      const l = z.lz[+a]; if(!l) return;
      const t = ton(l.Tage);
      const ring = Math.max(0, Math.min(100, l.Tage == null ? 0 : Math.round(Math.max(l.Tage, 0) / (l.Art === "Test" ? 30 : 365) * 100)));
      let h = '<h2 id="blatt-titel">' + esc(l.Firma) + '</h2><div class="sub">SIM ' + esc(l.Sim) + " · " + esc(l.Art || "–") + "</div>" +
        '<div class="ring" style="--p:' + ring + ";--f:var(--" + (t === "grau" ? "leise" : t) + ')"><div><div><b class="' + (t === "gruen" ? "" : "t-" + t) + '">' + (l.Tage == null ? "?" : Math.abs(l.Tage)) + "</b><span>" + (l.Tage != null && l.Tage < 0 ? "Tage drüber" : "Tage übrig") + "</span></div></div></div>" +
        felder([["Ausgestellt", fmt(l.Ausgestellt, true)], ["Läuft ab", fmt(l.Ablauf)], ["Restlaufzeit", tageText(l.Tage)], ["Notiz", l.Notiz]]);
      if((l.OffeneMails || []).length){
        h += '<div class="abschnitt">Offene Mails</div><div class="liste">' + l.OffeneMails.map(m => '<div class="zeile"><div class="mitte"><div class="haupt">' + esc(m.Betreff) + '</div><div class="neben">' + esc(m.Von) + " · seit " + esc(alterText(m.AlterTage)) + "</div></div></div>").join("") + "</div>";
      }
      h += '<div class="abschnitt">Historie<span>' + (l.Historie || []).length + " Eintr.</span></div>" + '<div class="zeitstrahl">' +
        (l.Historie || []).slice().reverse().map(e => '<div class="punkt"><b>' + esc(e.Art || "Lizenz") + " bis " + fmt(e.Laufzeit) + "</b><div>ausgestellt " + fmt(e.Datum, true) + (e.Firma !== l.Firma ? " · als „" + esc(e.Firma) + "“" : "") + "</div></div>").join("") + "</div>";
      oeffne(h);
    } else if(art === "mail"){
      const m = z.mails[+a]; if(!m) return;
      let h = '<h2 id="blatt-titel">' + esc(m.Betreff) + '</h2><div class="sub">' + esc(m.Art) + " · eingegangen " + esc(m.Datum) + "</div>" +
        felder([["Von", m.Name || "–"], ["Adresse", esc(m.Adresse) + '<button class="kopieren" data-kopier="' + esc(m.Adresse) + '">Kopieren</button>', true],
                ["Alter", alterText(m.AlterTage)], ["Status", m.Intern ? "intern" : (m.Beantwortet ? "beantwortet" : "offen")]]);
      if(m.Lizenz){
        const i = z.lz.findIndex(x => x.Sim === m.Lizenz.Sim);
        h += '<div class="abschnitt">Lizenz des Kunden</div><div class="liste"><button class="zeile" data-blatt="lizenz:' + i + '"><div class="mitte"><div class="haupt">' + esc(m.Lizenz.Firma) + '</div><div class="neben">SIM ' + esc(m.Lizenz.Sim) + '</div></div><div class="rechts"><span class="chip c-' + ton(m.Lizenz.Tage) + '">' + esc(tageText(m.Lizenz.Tage)) + '</span></div><span class="pfeil"></span></button></div>';
      }
      if(!m.Intern && !m.Beantwortet) h += '<div class="unter" style="margin-top:14px">Erledigt, zum Beispiel telefonisch? Am PC mit <span class="mono">LizenzRoboter.exe erledigt "' + esc(m.Domaene) + '"</span> ablegen oder Claude Bescheid sagen.</div>';
      oeffne(h);
    } else if(art === "backlog"){
      const x = z.bl[+a]; if(!x) return;
      oeffne('<h2 id="blatt-titel">' + esc(x.Thema) + '</h2><div class="sub"><span class="mono">' + esc(x.ID) + "</span> · " + esc(x.Tool) + "</div>" +
        felder([["Prio", x.Prio], ["Status", x.Status], ["Art", x.Art], ["Aufwand", x.Aufwand], ["Tool", x.Tool]]) +
        '<div class="unter" style="margin-top:14px">Aufwand: S bis ca. 1 Tag · M 2–5 Tage · L mehr als eine Woche. Ändern nur in der Excel-Mappe am PC.</div>');
    } else if(art === "commit"){
      const gr = ((daten.Releases || {})[a === "seit" ? "SeitRelease" : "ImRelease"] || []).find(g => g.Repo === b);
      const cm = gr && gr.Commits[+c]; if(!cm) return;
      oeffne('<h2 id="blatt-titel">' + esc(cm.Inhalt) + '</h2><div class="sub">' + esc(b) + " · " + (a === "seit" ? "noch nicht beim Kunden" : "im Release " + esc((daten.Releases.Online || {}).Version || "")) + "</div>" +
        felder([["Commit", cm.Hash], ["Datum", cm.Datum], ["Stand", cm.Stand || "nicht eingetragen"], ["Grenze", gr.Genau ? "exakt aus dem Beipackzettel" : "nach Uhrzeit geschätzt"]]) +
        (() => { const v = arr((vlRepo(b) || {}).Commits).find(x => x.Hash === cm.Hash);
                 return v && v.Text ? '<div class="abschnitt">Beschreibung</div><div class="text" style="font-size:14px;color:var(--leise)">' + absaetze(v.Text) + "</div>" : ""; })());
    } else if(art === "roboter"){
      const r = (daten.System || {}).Roboter || {};
      oeffne('<h2 id="blatt-titel">LizenzRoboter</h2><div class="sub">Geplante Aufgabe, alle 5 Minuten</div>' +
        felder([["Letzter Lauf", fmt(r.LetzterLauf, true)], ["Nächster Lauf", fmt(r.NaechsterLauf, true)], ["Zustand", r.Ok && !r.LetzterMitFehler ? "läuft" : "Fehler"], ["Fehler in 24 Läufen", String(r.FehlerIn24 || 0)]]) +
        '<div class="abschnitt">Protokoll</div><div class="proto">' + (r.Protokoll || []).map(esc).join("\n") + "</div>");
    } else if(art === "sicherung"){
      const s = (daten.System || {}).Sicherung || {};
      oeffne('<h2 id="blatt-titel">Sicherung</h2><div class="sub">D:\\MariusSchmidt\\Productivity</div>' +
        felder([["Letzte Sicherung", fmt(s.Datum, true)], ["Umfang", s.BelegtMB ? s.BelegtMB + " MB" : "–"], ["Laufwerk", s.LaufwerkDa ? "angeschlossen" : "nicht angeschlossen"], ["Privater Schlüssel", s.SchluesselGesichert ? "gesichert, Prüfsumme stimmt" : "weicht ab – sichern"]]) +
        (s.AusSpeicher ? '<div class="unter" style="margin-top:12px">Zuletzt gesehener Stand – die Platte war beim letzten Lauf nicht dran.</div>' : ""));
    } else if(art === "repos"){
      const rep = (daten.System || {}).Repos || [];
      oeffne('<h2 id="blatt-titel">Repos</h2><div class="sub">Zweig, lokale Änderungen, Rückstand</div><div class="liste">' + rep.map(r => {
        const sauber = !r.Geaendert && !r.NichtGepusht && !r.Rueckstand && !r.OffenePRs;
        const was = [r.Geaendert ? r.Geaendert + " geändert" : "", r.NichtGepusht ? r.NichtGepusht + " nicht gepusht" : "", r.Rueckstand ? r.Rueckstand + " hinterher" : "", r.OffenePRs ? r.OffenePRs + " offene PR" : ""].filter(Boolean).join(" · ");
        return '<div class="zeile"><div class="mitte"><div class="haupt">' + esc(r.Name) + '</div><div class="neben">' + esc(r.Zweig) + (was ? " · " + esc(was) : "") + '</div></div><span class="chip ' + (r.Rueckstand || r.OffenePRs ? "c-rot" : (sauber ? "c-gruen" : "c-gelb")) + '">' + (sauber ? "sauber" : "offen") + "</span></div>";
      }).join("") + "</div>");
    } else if(art === "freigaben"){
      const fr = daten.Freigaben || [];
      oeffne('<h2 id="blatt-titel">Freigaben</h2><div class="sub">Lizenzanfragen, die auf dein Ja warten</div>' + (fr.length ? '<div class="liste">' + fr.map(x => '<div class="zeile"><div class="mitte"><div class="haupt">' + esc(x.Lizenznehmer) + '</div><div class="neben">SIM ' + esc(x.Sim) + ' · gültig bis ' + esc(x.GueltigBis) + ' · <span class="mono">' + esc(x.Kennzeichen) + '</span></div></div></div>').join("") + "</div>" : '<div class="liste"><div class="leer">Nichts wartet auf ein Ja.</div></div>') +
        '<div class="unter" style="margin-top:14px">Freigeben mit einem Wort als Antwort auf die Freigabemail: ja oder nein.</div>');
    } else if(art === "releases-sheet"){
      wechsle("releases");
    } else if(art === "release"){
      const neu = a === "neu", r = neu ? null : vlRelease(a); if(!neu && !r) return;
      let h = neu ? '<h2 id="blatt-titel">Noch nicht veröffentlicht</h2><div class="sub">Committet seit dem letzten Release, noch nicht beim Kunden</div>'
                  : '<h2 id="blatt-titel">' + esc(r.Version || "Release") + '</h2><div class="sub">veröffentlicht ' + fmt(r.Datum, true) + " · " + esc(vor(r.Datum)) + (r.Online ? " · online" : "") + "</div>";
      if(r && r.Aeltestes){ oeffne(h + '<div class="unter">Das älteste noch bekannte Release. Was gegenüber dem Vorgänger neu war, lässt sich nicht mehr sagen – das Archiv hält nur die letzten Releases.</div>'); return; }
      let n = 0;
      arr(vl().Repos).filter(x => x.ImInstaller).forEach(x => {
        const cs = arr(x.Commits).filter(c => neu ? istNeu(c) : c.Release === a); if(!cs.length) return; n += cs.length;
        h += '<div class="abschnitt">' + esc(x.Name) + "<span>" + cs.length + '</span></div><div class="liste">' + cs.map(c => commitZeile(c, x.Name)).join("") + "</div>";
      });
      if(!n) h += '<div class="liste"><div class="leer">' + (neu ? "Nichts Neues – online ist der aktuelle Stand." : "Keine Änderung an den Werkzeugen.") + "</div></div>";
      oeffne(h + '<div class="unter" style="margin-top:12px">Antippen für die ganze Beschreibung.</div>');
    } else if(art === "repo"){
      const x = vlRepo(a); if(!x) return;
      const cs = arr(x.Commits), gruppen = [], nach = {};
      cs.forEach(c => { let g;
        if(x.ImInstaller) g = istNeu(c) ? "neu" : (c.Release == null ? "frueher" : c.Release);
        else { const d = datum(c.Datum); g = d ? d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) : "?"; }
        if(!nach[g]){ nach[g] = []; gruppen.push(g); } nach[g].push(c); });
      const rels = arr(vl().Releases), aeltestes = rels[rels.length - 1];
      let h = '<h2 id="blatt-titel">' + esc(x.Name) + '</h2><div class="sub">Zweig ' + esc(x.Zweig) + " · " + esc(x.Gesamt) + " Commits" + (x.ImInstaller ? "" : " · nicht Teil des Installers") + "</div>" +
        '<input class="suche" id="blatt-suche" type="search" placeholder="Suchen – Text oder Hash" autocomplete="off">';
      h += gruppen.map(g => {
        let t;
        if(!x.ImInstaller){ const p = g.split("-"); t = new Date(+p[0], +p[1] - 1, 1).toLocaleDateString("de-DE", {month: "long", year: "numeric"}); }
        else if(g === "neu") t = "Noch nicht veröffentlicht";
        else if(g === "frueher") t = "Früher" + (aeltestes ? " – bis " + (aeltestes.Version || "?") : "");
        else { const r = vlRelease(g); t = r ? (r.Version || "?") + " · " + fmt(r.Datum) : g; }
        return '<div class="vl-gruppe"><div class="abschnitt">' + esc(t) + "<span>" + nach[g].length + '</span></div><div class="liste">' + nach[g].map(c => commitZeile(c, x.Name)).join("") + "</div></div>";
      }).join("");
      if(x.Gesamt > cs.length) h += '<div class="unter" style="margin-top:12px">Gezeigt: die letzten ' + cs.length + " von " + esc(x.Gesamt) + " Commits.</div>";
      oeffne(h);
      const s = document.getElementById("blatt-suche");
      s.addEventListener("input", () => { const q = s.value.trim().toLowerCase();
        blatt.querySelectorAll("details.cm").forEach(d => { d.hidden = !!q && d.dataset.suche.indexOf(q) < 0; });
        blatt.querySelectorAll(".vl-gruppe").forEach(g => { g.hidden = !g.querySelector("details.cm:not([hidden])"); }); });
    }
  }

  // ---- Bedienung -------------------------------------------------------
  function wechsle(r){
    if(r === "uebersicht-freigaben"){ blattFuer("freigaben"); return; }
    reiter = r; merk.schreib({reiter: r}); window.scrollTo(0, 0);
    document.querySelectorAll(".reiter button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.reiter === r)));
    zeichne();
  }
  document.querySelector(".reiter").addEventListener("click", (e) => { const b = e.target.closest("button[data-reiter]"); if(b) wechsle(b.dataset.reiter); });
  document.addEventListener("click", (e) => {
    const k = e.target.closest("[data-kopier]");
    if(k){ const t = k.dataset.kopier; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { k.textContent = "Kopiert"; }).catch(() => { const r = document.createRange(); r.selectNodeContents(k.previousSibling || k); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }); return; }
    const g = e.target.closest("[data-geh]"); if(g){ wechsle(g.dataset.geh); return; }
    const f = e.target.closest("[data-filter]"); if(f){ filter[f.dataset.filter] = f.dataset.wert; merk.schreib({filter}); zeichne(); return; }
    const d = e.target.closest("[data-blatt]"); if(d){ blattFuer(d.dataset.blatt); return; }
    if(e.target === schleier || e.target.closest(".blatt .zu")) schliesse();
  });
  document.addEventListener("keydown", (e) => { if(e.key === "Escape" && !blatt.hidden) schliesse(); });
  neuKnopf.addEventListener("click", () => laden(true));
  document.addEventListener("visibilitychange", () => { if(!document.hidden && daten && Date.now() - (merk.lies().geholt || 0) > 120000) laden(false); });
  setInterval(() => { if(!document.hidden) { kopfStand(); } }, 30000);
  setInterval(() => { if(!document.hidden) laden(false); }, 300000);

  // Home-Bildschirm: Name und Symbol, falls die Seite eigenstaendig
  // geoeffnet wird. In einer eingebetteten Ansicht bestimmt claude.ai das Symbol.
  try {
    const kopf = document.head || document.documentElement;
    [["apple-touch-icon", "apple-touch-icon.png"]].forEach(([rel, href]) => { const l = document.createElement("link"); l.rel = rel; l.href = href; kopf.appendChild(l); });
    [["apple-mobile-web-app-title", "Productivity"], ["application-name", "Productivity"], ["theme-color", "#0d0f13"], ["apple-mobile-web-app-status-bar-style", "black-translucent"]]
      .forEach(([n, c]) => { const m = document.createElement("meta"); m.name = n; m.content = c; kopf.appendChild(m); });
  } catch(e){}

  // ---- Start: sofort den letzten Stand zeigen, dann frisch laden -------
  const alt = merk.lies();
  if(alt.filter) Object.assign(filter, alt.filter);
  if(alt.reiter){ reiter = alt.reiter; document.querySelectorAll(".reiter button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.reiter === reiter))); }
  if(alt.daten){ daten = alt.daten; }
  zeichne();
  laden(false);
})();
</script>

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}</script>
</body>
</html>
